name: Tests

# Runs the full Unity Test Runner suite (EditMode + PlayMode) on every push and PR to main.
# A green run here is what powers the "tests passing" badge in the README.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  test:
    name: EditMode & PlayMode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Library/ is a rebuildable import cache — caching it turns a ~15 min cold run
      # into a couple of minutes on subsequent runs. Keyed on the assets/packages hash.
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: 'Pulse Arena/Library'
          key: Library-${{ hashFiles('Pulse Arena/Assets/**', 'Pulse Arena/Packages/**', 'Pulse Arena/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          # Unity PERSONAL (free) license needs all THREE: the .ulf contents + the account email + password.
          # (Pro/Plus instead: UNITY_SERIAL + UNITY_EMAIL + UNITY_PASSWORD.)
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: 'Pulse Arena' # the Unity project lives in a subfolder of the repo
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test results
          artifactsPath: test-results

      # Keeps the pass/fail report + per-test details downloadable from the run page, even on failure.
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results
          path: test-results
